<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" fill="none" aria-label="Nèg Mawon — Marron Inconnu">
  <!-- Stylized silhouette of the Nèg Mawon (Marron Inconnu de Saint-Domingue):
       a kneeling man blowing the conch shell (lambi), machete in hand,
       a broken chain at his ankle — symbol of the call to freedom. -->
  <g fill="currentColor">
    <!-- back / kneeling right leg (shin along the ground) -->
    <path d="M120 470 q-8 -10 6 -16 l120 -10 q18 -1 18 13 q0 12 -16 13 l-110 6 q-12 1 -18 -6 z"/>
    <!-- thigh down to knee -->
    <path d="M196 360 q22 18 6 50 q-10 22 -36 30 q-22 6 -30 -10 q-6 -14 10 -26 q34 -26 50 -44 z"/>
    <!-- front bent leg (foot planted) -->
    <path d="M150 300 q40 6 44 50 q3 40 -10 70 q-6 14 -22 12 q-14 -2 -12 -18 q6 -40 -2 -66 q-8 -28 -22 -36 q-12 -8 -2 -18 q12 -10 26 6 z"/>
    <path d="M118 452 q-16 2 -20 16 q-2 10 10 11 l40 0 q12 -1 10 -12 q-2 -12 -16 -13 z"/>
    <!-- torso, leaning, powerful back -->
    <path d="M150 150 q44 -6 60 40 q16 50 4 110 q-6 30 -34 34 q-30 4 -52 -16 q-22 -22 -18 -78 q4 -70 40 -90 z"/>
    <!-- head, looking up to the call -->
    <circle cx="176" cy="120" r="30"/>
    <path d="M150 132 q-14 4 -16 -8 q-2 -12 12 -16 q14 -2 16 10 q2 12 -12 14 z"/>
    <!-- raised arm bringing the conch to the mouth -->
    <path d="M196 168 q44 -6 70 -44 q14 -20 30 -10 q14 10 2 30 q-26 44 -76 60 q-22 7 -34 -8 q-10 -14 8 -22 z"/>
    <!-- conch shell (lambi) at the mouth -->
    <path d="M286 96 q26 -10 40 8 q14 18 -2 36 q-18 20 -42 12 q-20 -7 -18 -28 q2 -20 22 -28 z
             M300 112 q-8 4 -6 14 q2 8 12 8 q10 0 12 -10 q2 -10 -8 -14 q-6 -2 -10 2 z" fill-rule="evenodd"/>
    <!-- lower arm + machete reaching back/down -->
    <path d="M150 210 q-40 6 -70 44 q-12 16 -28 8 q-14 -8 -4 -26 q24 -42 78 -56 q22 -6 32 8 q8 12 -8 22 z"/>
    <path d="M70 268 l-44 70 q-6 10 4 14 q9 4 15 -6 l40 -72 q4 -8 -4 -10 q-7 -2 -11 4 z"/>
    <!-- broken chain at the ankle (freedom) -->
    <g opacity="0.95">
      <ellipse cx="246" cy="486" rx="11" ry="8"/>
      <ellipse cx="246" cy="486" rx="5" ry="3.5" fill="#04060e"/>
      <ellipse cx="272" cy="492" rx="9" ry="6.5"/>
      <ellipse cx="296" cy="498" rx="8" ry="6"/>
    </g>
  </g>
</svg>
